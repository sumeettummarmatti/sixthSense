  /responders/offers/{offer_id}/going:
    post:
      tags: [matching]
      summary: "I'm going"
      description: >
        The first two get the traveller's precise live location (E2E); 409 enough_helpers after
        that. Returns the traveller's keys so I can share my location back. Saying "I'm going"
        needs a fresh face scan of the person holding the phone (selfie_image) in this same
        request: FACE_CHECK_PROVIDER=mock checks only that a real image was sent (the phone checks
        one face is visible); compreface matches it against the face template saved at
        verification. The image is never stored. Asking again once going returns the keys without
        a new scan.
      security: [{bearer: []}]
      parameters:
        - {name: offer_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                selfie_image: {type: string, format: binary, description: "JPEG, PNG or WebP, max 5 MB"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnerKeys"}
        "401": {$ref: "#/components/responses/NotAuthenticated"}
        "403": {description: "not_eligible, not_a_responder or face_mismatch"}
        "409": {description: "enough_helpers, or face_template_not_enrolled (compreface)"}
        "413": {description: image_too_large}
        "415": {description: unsupported_image_type}
        "422": {description: "empty_image or face_image_invalid"}
        "428": {description: face_scan_required}
        "503": {description: "Face matcher unavailable (compreface): fails closed, retry"}

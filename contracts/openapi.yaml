  /routes:
    get:
      tags: [routing]
      summary: Walking routes between two points, ranked for this hour (Insight, no sign-in)
      description: >
        Several distinct walking routes from a routing engine, each scored by what is around it
        (streetlights, places open, bus stops, stations, police, hospitals) and pulled down by
        published report cells. The recommended route is at most 25% / 600 m longer than the
        shortest. A route request carries no identity (rule 4); start and destination are never
        stored or logged (rule 2). No route is labelled safe (rule 5).
      parameters:
        - {name: from, in: query, required: true, description: "lat,lon",
           schema: {type: string, example: "12.9719,77.6412"}}
        - {name: to, in: query, required: true, description: "lat,lon",
           schema: {type: string, example: "12.9610,77.6390"}}
        - {name: at, in: query, required: false,
           description: "day | evening | night | ISO datetime; default is now (Asia/Kolkata)",
           schema: {type: string, example: night}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RankedRoutes"}
        "404": {description: no_route}
        "422": {description: "outside_area, or a bad parameter"}
        "503": {description: routing_unavailable}
  /routes/reports:
    post:
      tags: [reports]
      summary: Anonymous report about a place; feeds route ranking (Insight, no sign-in)
      description: >
        Kept as a ~55 m cell, a category, a time and an HMAC of the opaque reporter token, nothing
        else (rule 6). A cell is shown to anyone, and used by routing, only once it has
        PUBLISH_MIN_REPORTS reports from PUBLISH_MIN_DEVICES different reporters. Evidence halves
        every 30 days and expires after 90.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlaceReport"}
      responses:
        "202": {description: accepted}
        "422": {description: "outside_area, or a bad body"}
        "429": {description: "too_many_reports (per reporter token, per hour)"}

      parameters: [{name: walk_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/WalkView"}}}}
        "404": {description: walk_not_found}
  /walks/{walk_id}/accept:
    post:
      tags: [walk]
      summary: Companion accepts with a fresh face scan; both then see the handshake code and share live location (E2E)
      description: >
        Every accept needs a fresh face scan of the person holding the phone (selfie_image) in
        this same request, so a modified app cannot skip it. Only a passing scan accepts the walk
        and opens the two-way live location. FACE_CHECK_PROVIDER=mock checks only that a real
        image was sent (the phone checks one face is visible); compreface matches it against the
        face template saved at verification. The image is never stored; pass/fail is audited.
      security: [{bearer: []}]
      parameters: [{name: walk_id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [selfie_image]
              properties:
                selfie_image: {type: string, format: binary, description: "JPEG, PNG or WebP, max 5 MB"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/WalkView"}}}}
        "403": {description: "not_eligible or face_mismatch"}
        "409": {description: "walk_expired, walk_declined, walk_cancelled, already_walking, or face_template_not_enrolled (compreface)"}
        "413": {description: image_too_large}
        "415": {description: unsupported_image_type}
        "422": {description: "empty_image or face_image_invalid"}
        "428": {description: face_scan_required}
        "503": {description: "Face matcher unavailable (compreface): fails closed, retry"}
  /walks/{walk_id}/decline:
    post:
      tags: [walk]
      summary: Companion declines
      security: [{bearer: []}]
      parameters: [{name: walk_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"204": {description: Done}}
  /walks/{walk_id}/cancel:
    post:
      tags: [walk]
      summary: Traveller withdraws an unanswered request
      security: [{bearer: []}]
      parameters: [{name: walk_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"204": {description: Done}}
  /walks/{walk_id}/end:
    post:
      tags: [walk]
      summary: Either side ends the walk; the traveller's journey keeps running
      security: [{bearer: []}]
      parameters: [{name: walk_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/WalkView"}}}}
        "409": {description: Walk not accepted}
  /feedback:
    post:
      tags: [feedback]
      summary: How was it? (journey owner only, once per journey and once per walk)
      description: Stored raw. No location, no names; nothing is scored yet. Exported by backend/scripts/feedback.py.
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [journey_id, route_stars]
              properties:
                journey_id: {type: string, format: uuid}
                walk_id: {type: string, format: uuid, nullable: true, description: An ended walk on this journey}
                route_stars: {type: integer, minimum: 1, maximum: 5}
                companion_stars: {type: integer, minimum: 1, maximum: 5, nullable: true, description: Only with walk_id}
                chips:
                  type: array
                  items: {type: string, enum: [well_lit, felt_uneasy, companion_was_late, route_confusing, would_walk_again, busy_street, poor_footpath]}
                note: {type: string, maxLength: 500}
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: {type: object, required: [id], properties: {id: {type: string, format: uuid}}}
        "404": {description: "journey_not_found or walk_not_found"}
        "409": {description: feedback_already_given}
        "422": {description: Invalid field}

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "Access token from /auth/otp/verify or /auth/device/verify. Send as Authorization: Bearer <token>."
  responses:
    ValidationError:
      description: Request body failed validation
    NotAuthenticated:
      description: "Missing, expired or unknown access token (detail: not_authenticated)"
  schemas:
    RankedRoute:
      type: object
      required: [kind, points, distance_m, duration_s, extra_m, extra_s, score, support, concern,
                 coverage, evidence, counts, facts, why]
      properties:
        kind: {type: string, enum: [recommended, shortest, alternative]}
        points: {type: array, description: "[lat, lon] pairs",
                 items: {type: array, items: {type: number}, minItems: 2, maxItems: 2}}
        distance_m: {type: integer}
        duration_s: {type: integer}
        extra_m: {type: integer, description: Against the shortest route}
        extra_s: {type: integer}
        score: {type: number, description: "0..1: support reduced by concern"}
        support: {type: number, description: "0..1 from what is around the route at this hour"}
        concern: {type: number, description: "0..1 from published report cells only"}
        coverage: {type: number, description: Share of the route inside the data area}
        evidence: {$ref: "#/components/schemas/RiskLabel"}
        counts:
          type: object
          additionalProperties: {type: integer}
          example: {lamp: 38, open: 12, bus_stop: 3, station: 1, police: 0, hospital: 1}
        facts: {type: array, items: {type: string}, example: ["38 streetlights", "12 places open late"]}
        why: {type: array, items: {type: string}, example: ["+1 min", "38 streetlights vs 11"],
              description: Only on the recommended route, against the shortest}
    RankedRoutes:
      type: object
      required: [area, time_band, shortest, recommended, routes, note]
      properties:
        area: {type: string, example: indiranagar}
        time_band: {type: string, enum: [day, evening, night]}
        shortest: {type: integer, description: Index into routes}
        recommended: {type: integer, description: Index into routes; may equal shortest}
        routes: {type: array, items: {$ref: "#/components/schemas/RankedRoute"}}
        note: {type: string}
    RiskLabel:
      type: string
      enum: ["Strong evidence of concern", "Some reports of concern", "Insufficient data"]
      description: Rule 5. There is no "safe" label; no reports means unknown.
    PlaceReport:
      type: object
      required: [lat, lon, category, reporter]
      properties:
        lat: {type: number}
        lon: {type: number}
        category: {type: string, enum: [dark, no_footpath, harassment, unsafe_crossing, other]}
        reporter: {type: string, minLength: 8, maxLength: 128,
                   description: Opaque per-install token; only its HMAC is stored}
    ReportCell:
      type: object
      required: [lat, lon, count, weight]
      properties:
        lat: {type: number, description: Cell centre (~55 m cells)}
        lon: {type: number}
        count: {type: integer}
        weight: {type: number, description: Decayed evidence}
    RouteArea:
      type: object
      required: [name, label, bbox, sources, counts, published_cells, publish_min_reports,
                 publish_min_devices, demo]
      properties:
        name: {type: string}
        label: {type: string}
        bbox: {type: array, items: {type: number}, minItems: 4, maxItems: 4,
               description: "south, west, north, east"}
        sources: {type: array, items: {type: string}}
        counts: {type: object, additionalProperties: {type: integer}}
        published_cells: {type: array, items: {$ref: "#/components/schemas/ReportCell"}}
        publish_min_reports: {type: integer}
        publish_min_devices: {type: integer}
        demo: {type: boolean, description: Dev server; the demo page may simulate reporters}
    EscortStart:
      type: object
      required: [journey_id, minutes, contact_link_ids]
      properties:
        journey_id: {type: string, format: uuid}
        minutes: {type: integer, minimum: 5, maximum: 180}
        contact_link_ids: {type: array, minItems: 1, maxItems: 5, items: {type: string, format: uuid}}
        request_id: {type: string, format: uuid, nullable: true}
    EscortView:
      type: object
      properties:
        id: {type: string, format: uuid}
        journey_id: {type: string, format: uuid}
        started_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        listener_link_ids: {type: array, items: {type: string, format: uuid}}
    Stopped:
      type: object
      properties:
        stopped: {type: boolean}
    ListeningList:
      type: object
      properties:
        escorts:
          type: array
          items:
            type: object
            properties:
              escort_id: {type: string, format: uuid}
              journey_id: {type: string, format: uuid}
              contact_link_id: {type: string, format: uuid}
              owner_label: {type: string}
              ends_at: {type: string, format: date-time}
    SupportedList:
      type: object
      properties:
        people:
          type: array
          items:
            type: object
            properties:
              contact_link_id: {type: string, format: uuid}
              owner_label: {type: string}
    EscortRequestView:
      type: object
      properties:
        id: {type: string, format: uuid}
        contact_link_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    Error:
      type: object
      required: [detail]
      properties:
        detail: {type: string}
    OtpRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}
    OtpRequestAccepted:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [sent]}
    OtpVerify:
      type: object
      required: [email, code, device_public_key]
      properties:
        email: {type: string, format: email}
        code: {type: string, pattern: "^\\d{6}$", description: 6 digits, keep leading zeros}
        device_public_key:
          type: string
          maxLength: 512
          description: >
            Base64 (standard, with padding) X.509 SubjectPublicKeyInfo DER of an EC P-256 key
            generated in the Android Keystore (`keyStore.getCertificate(alias).publicKey.encoded`).
    DeviceChallengeRequest:
      type: object
      required: [device_id]
      properties:
        device_id: {type: string, format: uuid}
    DeviceChallenge:
      type: object
      required: [nonce, expires_in]
      properties:
        nonce: {type: string}
        expires_in: {type: integer, example: 120}
    DeviceVerify:
      type: object
      required: [device_id, nonce, signature]
      properties:
        device_id: {type: string, format: uuid}
        nonce: {type: string, maxLength: 128}
        signature:
          type: string
          maxLength: 256
          description: "Base64 DER ECDSA signature (SHA256withECDSA) over sixthsense-device-auth-v1|<device_id>|<nonce>"
    Session:
      type: object
      required: [access_token, token_type, expires_in, account_id, device_id]
      properties:
        access_token: {type: string}
        token_type: {type: string, enum: [bearer]}
        expires_in: {type: integer, example: 900, description: seconds}
        account_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid, description: Store this on the phone}
    E2EKeysUpload:
      type: object
      required: [x25519_public_key, ed25519_public_key]
      properties:
        x25519_public_key: {type: string, maxLength: 64, description: Base64 raw 32-byte X25519 public key}
        ed25519_public_key: {type: string, maxLength: 64, description: Base64 raw 32-byte Ed25519 public key}
    E2EKeys:
      type: object
      required: [key_id, x25519_public_key, ed25519_public_key]
      properties:
        key_id: {type: string, format: uuid}
        x25519_public_key: {type: string}
        ed25519_public_key: {type: string}
    InviteCreate:
      type: object
      required: [owner_label]
      properties:
        owner_label: {type: string, minLength: 1, maxLength: 40, description: "How the contact sees you in alerts, e.g. Priya"}
    Invite:
      type: object
      required: [contact_link_id, invite_token, invite_url, expires_at]
      properties:
        contact_link_id: {type: string, format: uuid, description: Store on the phone next to the contact's name and number}
        invite_token: {type: string}
        invite_url: {type: string, example: "https://sixthsense.app/invite#<token>"}
        expires_at: {type: string, format: date-time}
    InviteAccept:
      type: object
      required: [invite_token]
      properties:
        invite_token: {type: string, maxLength: 128, description: The part of the link after '#'}
    InviteAccepted:
      type: object
      required: [owner_label]
      properties:
        owner_label: {type: string}
    ContactLink:
      type: object
      required: [id, status, created_at, accepted_at, invite_expires_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [pending, accepted]}
        created_at: {type: string, format: date-time}
        accepted_at: {type: [string, "null"], format: date-time}
        invite_expires_at: {type: [string, "null"], format: date-time, description: Only for pending invites}
    ContactList:
      type: object
      required: [contacts]
      properties:
        contacts: {type: array, items: {$ref: "#/components/schemas/ContactLink"}}
    ContactKey:
      type: object
      required: [key_id, x25519_public_key, ed25519_public_key]
      properties:
        key_id: {type: string, format: uuid}
        x25519_public_key: {type: string}
        ed25519_public_key: {type: string}
    ContactKeys:
      type: object
      required: [contact_link_id, keys]
      properties:
        contact_link_id: {type: string, format: uuid}
        keys: {type: array, items: {$ref: "#/components/schemas/ContactKey"}}
    ProtocolSettings:
      type: object
      properties:
        check_in_interval_min: {type: integer, minimum: 1, maximum: 240, default: 15}
        check_in_grace_min: {type: integer, minimum: 0, maximum: 30, default: 2, description: "T1: check-in due -> private prompt"}
        prompt_timeout_min: {type: integer, minimum: 1, maximum: 30, default: 2, description: "T2: private prompt -> contacts alerted"}
        contact_response_min: {type: integer, minimum: 1, maximum: 60, default: 5, description: "Contacts alerted -> full escalation"}
        heartbeat_timeout_min: {type: integer, minimum: 2, maximum: 120, default: 10, description: "Silent phone -> contacts alerted"}
        auto_112: {type: boolean, default: false}
        alert_contact_ids:
          type: [array, "null"]
          maxItems: 5
          items: {type: string, format: uuid}
          description: Trusted contact link ids to alert; null = all accepted contacts
    JourneyStart:
      type: object
      properties:
        check_in_interval_min: {type: [integer, "null"], minimum: 1, maximum: 240, description: Override for this journey}
    CheckIn:
      type: object
      required: [result]
      properties:
        result: {type: string, enum: [ok, duress], description: Which PIN the phone accepted}
    Sos:
      type: object
      properties:
        covert: {type: boolean, default: false}
    JourneyView:
      type: object
      required: [id, state, outcome, started_at, next_check_in_at, timers]
      properties:
        id: {type: string, format: uuid}
        state:
          type: string
          enum: [active, check_in_due, private_prompt, contact_alert, full_escalation, resolved]
          description: A covert escalation is shown as active (or resolved after arrive/end)
        outcome: {type: [string, "null"], enum: [arrived, ended, resolved_by_contact, null]}
        started_at: {type: string, format: date-time}
        next_check_in_at: {type: string, format: date-time}
        timers: {$ref: "#/components/schemas/ProtocolSettings"}
    ChannelStatus:
      type: object
      required: [push, telegram, email, push_available, telegram_available]
      properties:
        push: {type: boolean, description: This device has sent its FCM token}
        telegram: {type: boolean}
        email: {type: boolean}
        push_available: {type: boolean, description: Server has FCM configured}
        telegram_available: {type: boolean, description: Server has a Telegram bot configured}
    PushToken:
      type: object
      required: [fcm_token]
      properties:
        fcm_token: {type: string, maxLength: 4096}
    TelegramLink:
      type: object
      required: [url, expires_in]
      properties:
        url: {type: string, example: "https://t.me/sixthsense_bot?start=<token>"}
        expires_in: {type: integer, example: 600}
    AlertEmail:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}
    ActiveEscalation:
      type: object
      required: [id, owner_label, level, covert, opened_at, acknowledged, verification_code]
      properties:
        id: {type: string, format: uuid}
        journey_id: {type: string, format: uuid, nullable: true, description: "Matches session_id in live location envelopes"}
        owner_label: {type: string}
        level: {type: string, enum: [contact_alert, full_escalation]}
        covert: {type: boolean, description: "Silent alarm: do NOT call their phone"}
        opened_at: {type: string, format: date-time}
        acknowledged: {type: boolean}
        i_am_helping: {type: boolean, description: "I said I'm on it, so I share my location back"}
        helpers_going: {type: integer}
        verification_code: {type: string, example: 7KQ2-9M4D, description: "Same code as in the Telegram/email alert; if they differ, that message is fake"}
    ActiveEscalations:
      type: object
      required: [escalations]
      properties:
        escalations: {type: array, items: {$ref: "#/components/schemas/ActiveEscalation"}}
    HelperKey:
      type: object
      required: [key_id, x25519_public_key, ed25519_public_key]
      properties:
        key_id: {type: string, format: uuid}
        x25519_public_key: {type: string, format: byte}
        ed25519_public_key: {type: string, format: byte}
    OwnerKeys:
      type: object
      required: [journey_id, keys]
      properties:
        journey_id: {type: string, format: uuid}
        keys: {type: array, items: {$ref: "#/components/schemas/HelperKey"}}
    Helper:
      type: object
      required: [id, kind, status, accepted_at, keys]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [contact, responder]}
        label: {type: string, nullable: true, description: "Responder's display name; contacts are named on the phone"}
        contact_link_id: {type: string, format: uuid, nullable: true}
        status: {type: string, enum: [going, arrived]}
        accepted_at: {type: string, format: date-time}
        keys: {type: array, items: {$ref: "#/components/schemas/HelperKey"}}
    HelpView:
      type: object
      required: [full_alert, any_alert, helpers]
      properties:
        full_alert: {type: boolean}
        any_alert: {type: boolean}
        helpers: {type: array, items: {$ref: "#/components/schemas/Helper"}}
        search:
          nullable: true
          description: "Nearby responder search during a full alert: counts only, never who or where"
          type: object
          required: [radius_m, on_duty_nearby, asked, going]
          properties:
            radius_m: {type: integer, description: "500, then 1000, then 2000"}
            on_duty_nearby: {type: integer}
            asked: {type: integer}
            going: {type: integer}
    LatLng:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
    ResponderApply:
      type: object
      required: [display_name]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 40}
    ResponderMe:
      type: object
      required: [status, on_duty]
      properties:
        status: {type: string, enum: [none, pending, approved, revoked]}
        display_name: {type: string, nullable: true}
        on_duty: {type: boolean}
    OnDuty:
      type: object
      required: [on_duty, expires_in_seconds]
      properties:
        on_duty: {type: boolean}
        expires_in_seconds: {type: integer}
    ResponderOffer:
      type: object
      required: [id, status, distance_m, walk_minutes, covert, opened_at, helpers_going]
      properties:
        id: {type: string, format: uuid}
        journey_id: {type: string, format: uuid, nullable: true, description: "Only after I'm going"}
        status: {type: string, enum: [offered, going, declined]}
        distance_m: {type: integer, description: "From rough areas (+-150 m)"}
        walk_minutes: {type: integer}
        rough_area: {allOf: [{$ref: "#/components/schemas/LatLng"}], nullable: true}
        covert: {type: boolean}
        opened_at: {type: string, format: date-time}
        helpers_going: {type: integer}
        arrived: {type: boolean}
    ResponderOffers:
      type: object
      required: [offers]
      properties:
        offers: {type: array, items: {$ref: "#/components/schemas/ResponderOffer"}}
    LinkAck:
      type: object
      required: [token]
      properties:
        token: {type: string, maxLength: 128}
    Acknowledged:
      type: object
      required: [owner_label, acknowledged]
      properties:
        owner_label: {type: string}
        acknowledged: {type: boolean}
    Resolved:
      type: object
      required: [journey_state]
      properties:
        journey_state: {type: string, enum: [active, resolved]}
    Raised:
      type: object
      required: [journey_state]
      properties:
        journey_state: {type: string, enum: [full_escalation]}
    SigningKey:
      type: object
      required: [key_id, alg, ed25519_public_key]
      properties:
        key_id: {type: string}
        alg: {type: string, enum: [Ed25519]}
        ed25519_public_key: {type: string, description: Base64 raw 32-byte public key}
    SigningKeys:
      type: object
      required: [keys]
      properties:
        keys: {type: array, items: {$ref: "#/components/schemas/SigningKey"}}
    Profile:
      type: object
      required: [first_name]
      properties:
        first_name: {type: string, minLength: 1, maxLength: 40}
        bio: {type: string, maxLength: 200}
        strengths:
          type: array
          items: {type: string, enum: [knows_the_area, first_aid_trained, walks_this_route_daily, speaks_kannada, speaks_hindi, self_defence_trained, calm_in_a_crisis, campus_volunteer]}
        languages: {type: array, items: {type: string, maxLength: 30}, maxItems: 8}
        gender: {type: string, enum: [woman, man, non_binary], nullable: true}
        willing_companion: {type: boolean}
    PartnerProfile:
      type: object
      description: What a walk partner sees. No gender, no account details.
      required: [first_name, bio, strengths, languages]
      properties:
        first_name: {type: string}
        bio: {type: string}
        strengths: {type: array, items: {type: string}}
        languages: {type: array, items: {type: string}}
    CompanionMe:
      type: object
      required: [status, available]
      properties:
        status: {type: string, enum: [none, approved, revoked], description: "approved = joined (no approval step)"}
        identity_verified: {type: boolean, description: "Verified, adult, unexpired identity (ID + selfie)"}
        verified_method: {type: string, nullable: true, description: '"identity" = joined after identity verification'}
        verified_at: {type: string, format: date-time, nullable: true}
        available: {type: boolean}
    WalkArea:
      type: object
      required: [latitude, longitude]
      description: A rough area, rounded to ~110 m on the server
      properties:
        latitude: {type: number}
        longitude: {type: number}
    CompanionCard:
      type: object
      required: [companion_id, profile, rating_count, distance_m, walk_minutes]
      properties:
        companion_id: {type: string, format: uuid}
        profile: {$ref: "#/components/schemas/PartnerProfile"}
        rating: {type: number, nullable: true, description: Average companion stars from past walks}
        rating_count: {type: integer}
        distance_m: {type: integer, description: Rounded to 100 m}
        walk_minutes: {type: integer}
    WalkRequest:
      type: object
      required: [id, traveller_first_name, expires_at]
      properties:
        id: {type: string, format: uuid}
        traveller_first_name: {type: string}
        rough_area: {$ref: "#/components/schemas/WalkArea"}
        distance_m: {type: integer, nullable: true}
        expires_at: {type: string, format: date-time}
    WalkView:
      type: object
      required: [id, role, status, partner_keys, expires_at]
      properties:
        id: {type: string, format: uuid, description: Also the live-location session id while accepted}

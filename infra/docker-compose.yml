# SixthSense local stack.
# Core and Insight are SEPARATE Postgres instances with separate credentials (ADR-1):
# a breach of analytics must reveal no person.
name: sixthsense

services:
  core-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${CORE_DB_USER:-core}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:-core_dev_password}
      POSTGRES_DB: ${CORE_DB_NAME:-sixthsense_core}
    ports: ["${CORE_DB_PORT:-5434}:5432"]
    volumes: [core-db-data:/var/lib/postgresql/data]
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  insight-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${INSIGHT_DB_USER:-insight}
      POSTGRES_PASSWORD: ${INSIGHT_DB_PASSWORD:-insight_dev_password}
      POSTGRES_DB: ${INSIGHT_DB_NAME:-sixthsense_insight}
    ports: ["${INSIGHT_DB_PORT:-5433}:5432"]
    volumes: [insight-db-data:/var/lib/postgresql/data]
    networks: [insight]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]  # ephemeral by design (presence, timers)
    ports: ["6379:6379"]
    networks: [core]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [nats-data:/data]
    networks: [core]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    # Local dev only: catches every email the Core API sends (sign-in codes). Nothing leaves
    # the machine. SMTP on :1025, web inbox on http://localhost:8025.
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]
    networks: [core]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/livez"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Self-hosted face matching for the local verification demo. Open its UI at :8003,
  # create a Face Verification service, then put that service's API key in .env.
  compreface:
    image: exadel/compreface:1.2.0
    platform: linux/amd64
    ports: ["127.0.0.1:8003:80"]
    volumes: [compreface-data:/var/lib/postgresql/data]

networks:
  core: {}
  insight: {}

volumes:
  core-db-data: {}
  insight-db-data: {}
  nats-data: {}
  compreface-data: {}

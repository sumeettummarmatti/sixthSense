[project]
name = "sixthsense-backend"
version = "0.1.0"
description = "SixthSense Core zone: modular monolith (identity, journey, escalation, walks, ...)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "redis>=5.0",
    "nats-py>=2.9",
    "arq>=0.26",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "fakeredis>=2.40.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # tests use fake secrets on purpose

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
